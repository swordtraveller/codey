<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codey</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand" aria-label="Codey">Codey</div>
        <div class="status"><span class="status-dot"></span>Ready</div>
      </header>

      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">Desktop workspace</p>
        <h1 id="welcome-title">Conversation, work and coding.</h1>
        <p class="intro">A quiet place to think clearly and move work forward.</p>
      </section>

      <footer class="footer">
        <span>Codey desktop</span>
        <span id="runtime">Electron</span>
      </footer>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
