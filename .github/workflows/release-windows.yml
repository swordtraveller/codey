name: Windows package

on:
  pull_request:
    branches:
      - main
      - 'release-*'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.16.0'

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$') {
            throw "Release tag must use semantic version syntax such as v0.6.2: $tag"
          }

          $tagVersion = $Matches.version
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch origin/main for release validation.'
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $tag must point to a commit contained in origin/main."
          }

      - name: Set up pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $corepackHome = Join-Path $env:RUNNER_TEMP 'corepack'
          $env:COREPACK_HOME = $corepackHome
          $env:COREPACK_DEFAULT_TO_LATEST = '0'
          $env:COREPACK_ENABLE_AUTO_PIN = '0'
          "COREPACK_HOME=$corepackHome" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'COREPACK_DEFAULT_TO_LATEST=0' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'COREPACK_ENABLE_AUTO_PIN=0' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enable Corepack.' }
          corepack prepare pnpm@10.12.1 --activate
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install the pinned pnpm version.' }
          node --version
          pnpm --version

      - name: Set up Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install the pinned Rust toolchain.' }
          rustc --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --maxWorkers=4

      - name: Build Windows installer
        run: pnpm dist

      - name: Verify and stage release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $installer = Join-Path $PWD "dist\Codey-$version-windows-x64-setup.exe"
          $app = Join-Path $PWD 'dist\win-unpacked\Codey.exe'
          $runner = Join-Path $PWD 'dist\win-unpacked\resources\app.asar.unpacked\native\rhai-runner.exe'

          foreach ($file in @($installer, $app, $runner)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected packaged file was not found: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Packaged file is empty: $file"
            }
          }

          node scripts/smoke-rhai-runner.mjs $runner
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Rhai runner smoke test failed.' }

          $stage = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination $stage -Force

          $installerName = Split-Path -Leaf $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codey-windows-${{ github.sha }}
          path: ${{ runner.temp }}\release-artifacts\*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codey-windows-${{ github.sha }}
          path: release-artifacts

      - name: Verify checksum
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS.txt

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            is_draft="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.draft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace public artifacts." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

          mapfile -t artifacts < <(find release-artifacts -maxdepth 1 -type f -print)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo 'No release artifacts were downloaded.' >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --repo "$GH_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
